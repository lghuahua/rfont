[workspace]
resolver = "2"
members = [
    "font_macros",
    "crates/rfont-types",
    "crates/rfont-core",
    "crates/rfont",
    "crates/rfont-cli"
]

# Workspace 级别的依赖管理，统一版本控制
[workspace.dependencies]
# 核心依赖
thiserror = "1.0"
encoding_rs = "0.8.33"
lru = "0.12"
brotli = "6.0"
flate2 = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1.19"

# CLI 相关依赖
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"
serde_json = "1.0"
anyhow = "1.0"

# 开发依赖
criterion = "0.5"
rayon = "1.8"

# proc-macro 依赖
proc-macro2 = "1.0.70"
quote = "1.0.33"
syn = "2.0.39"

# 构建优化配置
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true  # 移除调试符号，减小二进制大小
panic = "abort"  # 减小二进制大小

[profile.dev.package."*"]
opt-level = 2  # 优化依赖包的编译速度
