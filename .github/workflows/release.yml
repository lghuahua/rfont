name: Release

on:
  push:
    tags:
      - 'v*'

# 设置 workflow 权限
permissions:
  contents: write  # 允许创建 Release 和上传文件

env:
  CARGO_TERM_COLOR: always

jobs:
  # 构建和发布 CLI 工具
  build-cli:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rfont-cli-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rfont-cli-windows
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rfont-cli-macos
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Build CLI (release)
        run: cargo build --release --package rfont-cli --target ${{ matrix.target }}
      
      - name: Package binary (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rfont dist/
          cd dist
          tar czf ../${{ matrix.artifact_name }}.tar.gz rfont
      
      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/rfont.exe" -Destination "dist/"
          Set-Location dist
          Compress-Archive -Path rfont.exe -DestinationPath "../${{ matrix.artifact_name }}.zip"
      
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.*

  # 构建桌面应用
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rfont-desktop/src-tauri -> target"
      
      - name: Install frontend dependencies
        run: |
          cd rfont-desktop
          pnpm install
      
      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: rfont-desktop
          args: --verbose
      
      - name: Package desktop app
        shell: bash
        run: |
          BUNDLE_DIR="rfont-desktop/src-tauri/target/release/bundle"
          APP_NAME="rfont-desktop"
          
          if [ "${{ matrix.platform }}" = "windows" ]; then
            # Windows: 压缩 .exe
            cd "$BUNDLE_DIR/app"
            7z a -tzip "../../../${APP_NAME}-windows.zip" "${APP_NAME}.exe"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            # macOS: 压缩 .app 目录
            cd "$BUNDLE_DIR/app"
            zip -r "../../../${APP_NAME}-macos.zip" "${APP_NAME}.app"
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            # Linux: 压缩二进制文件
            cd "$BUNDLE_DIR/app"
            zip "../../../${APP_NAME}-linux.zip" "${APP_NAME}"
          fi
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rfont-desktop-${{ matrix.platform }}
          path: |
            rfont-desktop/src-tauri/target/*-windows.zip
            rfont-desktop/src-tauri/target/*-macos.zip
            rfont-desktop/src-tauri/target/*-linux.zip
          retention-days: 30
          if-no-files-found: error

  # 创建 GitHub Release（等待 CLI 和桌面应用都构建完成）
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-cli, build-desktop]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: cli-artifacts
      
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: desktop-artifacts
      
      - name: Display CLI structure
        run: ls -R cli-artifacts
      
      - name: Display Desktop structure
        run: ls -R desktop-artifacts
      
      - name: Create Release with CLI and Desktop
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cli-artifacts/**/*.tar.gz
            cli-artifacts/**/*.zip
            desktop-artifacts/**/*.zip
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
