name: Release

on:
  push:
    tags:
      - 'v*'

# 设置 workflow 权限
permissions:
  contents: write  # 允许创建 Release 和上传文件

env:
  CARGO_TERM_COLOR: always

jobs:
  # 构建和发布 CLI 工具
  build-cli:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rfont-cli-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rfont-cli-windows.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rfont-cli-macos
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Build CLI (release)
        run: cargo build --release --package rfont-cli --target ${{ matrix.target }}
      
      - name: Package binary (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rfont dist/
          cd dist
          tar czf ../${{ matrix.artifact_name }}.tar.gz rfont
      
      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rfont.exe dist/
          cd dist
          Compress-Archive -Path rfont.exe -DestinationPath ..\${{ matrix.artifact_name }}.zip
      
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.tar.gz
            *.zip

  # 创建 GitHub Release
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-cli]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Display structure
        run: ls -R
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rfont-cli-linux/*.tar.gz
            rfont-cli-windows/*.zip
            rfont-cli-macos/*.tar.gz
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
