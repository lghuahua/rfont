name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/release.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  # 测试任务 - Ubuntu（最快，用于快速反馈）
  test-ubuntu:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust  # 复用 Rust 环境配置
      - uses: ./.github/actions/run-tests  # 复用测试和构建步骤
        with:
          run-clippy: 'true'
          run-fmt: 'true'
          exclude-packages: 'rfont-desktop'

  # 测试任务 - Windows（较慢，不阻塞覆盖率）
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust  # 复用 Rust 环境配置
      - uses: ./.github/actions/run-tests  # 复用测试和构建步骤
        with:
          exclude-packages: 'rfont-desktop'

  # 测试任务 - macOS（中等速度，不阻塞覆盖率）
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust  # 复用 Rust 环境配置
      - uses: ./.github/actions/run-tests  # 复用测试和构建步骤
        with:
          exclude-packages: 'rfont-desktop'

  # 代码覆盖率（只依赖 Ubuntu 测试，快速启动）
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test-ubuntu  # 只等待最快的 Ubuntu 测试
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust  # 复用 Rust 环境配置
      
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      
      - name: Generate coverage
        run: |
          cargo llvm-cov \
            --workspace \
            --exclude rfont-desktop \
            --lcov \
            --output-path lcov.info \
            --ignore-filename-regex "tests|benches|examples" \
            --verbose
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # 文档检查
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust  # 复用 Rust 环境配置
      
      - name: Check documentation
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # WASM 编译冒烟检查（确保 rfont-web 能编到 wasm32，不部署）
  wasm-check:
    name: WASM Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "wasm-web"

      - name: Check WASM build
        run: cargo build -p rfont-web --target wasm32-unknown-unknown --release
