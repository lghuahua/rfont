[package]
name = "rfont"
version = "0.1.0"
edition = "2024"
description = "高性能字体子集化和转换库，支持 TTF/WOFF/WOFF2 格式"
authors = ["lghuahua"]
license = "MIT"
repository = "https://github.com/lghuahua/rfont"
keywords = ["font", "subset", "woff2", "ttf", "web-font"]
categories = ["text-processing"]

[dependencies]
rfont-core = { path = "../rfont-core" }
rfont-types = { path = "../rfont-types" }
flate2 = { workspace = true }
brotli = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
once_cell = { workspace = true }
lru = { workspace = true }
rayon = { workspace = true, optional = true }
anyhow = { workspace = true }

[features]
default = []
parallel = ["dep:rayon"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "performance"
harness = false
