[package]
name = "font_macros"
version.workspace = true
edition = "2024"
description = "字体库的 proc-macro 宏定义"
authors = ["lghuahua"]
license = "MIT"
repository = "https://github.com/lghuahua/rfont"
publish = false  # 不发布到 crates.io，作为内部依赖

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[package.metadata.release]
tag = false
shared-version = "core"