[package]
name = "rfont-cli"
version = "0.1.0"
edition = "2021"
description = "命令行字体子集化和转换工具"
authors = ["rfont Team"]

[[bin]]
name = "rfont"
path = "src/main.rs"

[dependencies]
rfont = { path = "../rfont" }
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
