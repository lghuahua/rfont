[package]
name = "rfont-cli"
version = "0.1.0"
edition = "2021"
description = "命令行字体子集化和转换工具，支持 TTF/WOFF/WOFF2 格式"
authors = ["rfont Team"]
license = "MIT OR Apache-2.0"
keywords = ["font", "cli", "subset", "woff2"]
categories = ["command-line-utilities"]

[[bin]]
name = "rfont"
path = "src/main.rs"

[dependencies]
rfont = { path = "../rfont" }
clap = { workspace = true }
colored = { workspace = true }
indicatif = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
